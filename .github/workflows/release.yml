name: Release Build
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag (e.g. v1.0.8)"
        required: true
        default: "v1.0.8"
      notes:
        description: "Release notes (optional; overrides CHANGELOG and auto notes)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate requested tag matches checked-out source
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::VERSION_NAME is missing from nb4a.properties"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/HuBoxForAndroid:refs/remotes/origin/HuBoxForAndroid
          if ! git merge-base --is-ancestor HEAD origin/HuBoxForAndroid; then
            echo "::error::Release source must already be merged into the HuBoxForAndroid default branch."
            exit 1
          fi
          EXPECTED_TAG="v$VERSION_NAME"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match checked-out app version '$VERSION_NAME' (expected '$EXPECTED_TAG')."
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.0.8775105"
      - name: Golang Status
        run: find buildScript libcore/*.sh nb4a.properties | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.11
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Upload LibCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - validate
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.0.8775105"
      - name: Download LibCore AAR
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Verify LibCore AAR
        run: |
          test -s app/libs/libcore.aar
          unzip -p app/libs/libcore.aar classes.jar > /tmp/libcore-classes.jar
          unzip -l /tmp/libcore-classes.jar | grep -q 'libcore/Libcore.class'
          unzip -l /tmp/libcore-classes.jar | grep -q 'go/Seq.class'
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          VERSION_NAME: ${{ needs.validate.outputs.version }}
          BUILD_PLUGIN: none
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
          if [ ! -f "release.keystore" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Release signing credentials missing. Refusing to build unsigned release."
            exit 1
          fi
          # Diagnostics: print keystore hash + alias list (no secret values printed)
          echo "=== signing diagnostics ==="
          sha256sum release.keystore || true
          KEYTOOL="${JAVA_HOME}/bin/keytool"
          [ -x "$KEYTOOL" ] || KEYTOOL="keytool"
          "$KEYTOOL" -list -keystore release.keystore -storepass "$KEYSTORE_PASS" 2>&1 | sed 's/^/keytool: /' || true
          echo "=== end diagnostics ==="
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> local.properties
          echo "ALIAS_NAME=$ALIAS_NAME" >> local.properties
          # PKCS12 keystore: the key password must equal the store password
          # (keytool ignores a separate -keypass), so do not use ALIAS_PASS here.
          echo "ALIAS_PASS=$KEYSTORE_PASS" >> local.properties

          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease

          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -n 1)
          if [ -n "$APK" ]; then
            APK_DIR=$(dirname "$APK")
          else
            APK_DIR="app/build/outputs/apk/preview/release"
          fi

          APKSIGNER=$(find ${ANDROID_HOME}/build-tools -name apksigner | sort -V | tail -n 1)
          [ -z "$APKSIGNER" ] && APKSIGNER="apksigner"
          echo "Using apksigner: $APKSIGNER"

          echo "Signing unsigned APKs in $APK_DIR..."
          for apk in "$APK_DIR"/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              signed_apk="${apk%-unsigned.apk}-signed.apk"
              echo "Signing $apk -> $signed_apk"
              $APKSIGNER sign --ks release.keystore --ks-pass pass:"$KEYSTORE_PASS" --key-pass pass:"$KEYSTORE_PASS" --ks-key-alias "${ALIAS_NAME:-hubox}" --out "$signed_apk" "$apk"
              rm "$apk"
            fi
          done

          echo "Verifying signed APKs..."
          for apk in "$APK_DIR"/*.apk; do
            if [ -f "$apk" ]; then
              echo "Verifying $apk..."
              $APKSIGNER verify --verbose "$apk" || { echo "::error::Signature verification failed for $apk"; exit 1; }
            fi
          done

          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::Android aapt tool was not found."
            exit 1
          fi
          shopt -s nullglob
          BUILT_APKS=("$APK_DIR"/*.apk)
          if [ "${#BUILT_APKS[@]}" -ne 4 ]; then
            echo "::error::Expected exactly four ABI APKs, found ${#BUILT_APKS[@]}."
            exit 1
          fi
          DIST_DIR="$PWD/app/build/outputs/apk/release-distribution"
          mkdir -p "$DIST_DIR"
          for apk in "${BUILT_APKS[@]}"; do
            ACTUAL_VERSION=$("$AAPT" dump badging "$apk" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" | head -n 1)
            if [ "$ACTUAL_VERSION" != "$VERSION_NAME" ]; then
              echo "::error::APK $apk has version '$ACTUAL_VERSION', expected '$VERSION_NAME'."
              exit 1
            fi
            NAME=$(basename "$apk")
            case "$NAME" in
              *arm64-v8a*) ABI="arm64-v8a" ;;
              *armeabi-v7a*) ABI="armeabi-v7a" ;;
              *x86_64*) ABI="x86_64" ;;
              *x86*) ABI="x86" ;;
              *) echo "::error::Cannot determine ABI for $NAME"; exit 1 ;;
            esac
            cp "$apk" "$DIST_DIR/HuBox-$VERSION_NAME-$ABI-release.apk"
          done
          test "$(find "$DIST_DIR" -maxdepth 1 -name '*.apk' | wc -l)" -eq 4

          rm -f release.keystore

          echo "APK=$DIST_DIR" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Prepare APKs and Checksums
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks/ \;
          cd apks
          sha256sum *.apk > sha256sums.txt
          cd ..
          ls -la apks/
      - name: Prepare Release Notes
        env:
          VERSION_NAME: ${{ needs.validate.outputs.version }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          # HuBox: release notes live on the Release page only. Sources, in
          # order: dispatch input, legacy CHANGELOG section, git history.
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > RELEASE_NOTES.md
          elif [ -f CHANGELOG.md ] && grep -q "^# HuBox for Android v$VERSION_NAME$" CHANGELOG.md; then
            awk '/^# HuBox for Android v/{if(found) exit; found=1} found' CHANGELOG.md > RELEASE_NOTES.md
          else
            PREV_TAG=$(git tag --sort=-v:refname | grep -v "^v$VERSION_NAME$" | head -n 1)
            {
              echo "# HuBox for Android v$VERSION_NAME"
              echo
              if [ -n "$PREV_TAG" ]; then
                git log --pretty=format:'- %s' "$PREV_TAG"..HEAD
              else
                git log --pretty=format:'- %s' HEAD
              fi
              echo
            } > RELEASE_NOTES.md
          fi
          test -s RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: HuBox ${{ needs.validate.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            apks/*.apk
            apks/sha256sums.txt
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.tag, 'preview') || contains(needs.validate.outputs.tag, 'alpha') || contains(needs.validate.outputs.tag, 'beta') }}
          make_latest: ${{ !(contains(needs.validate.outputs.tag, 'preview') || contains(needs.validate.outputs.tag, 'alpha') || contains(needs.validate.outputs.tag, 'beta')) }}
          generate_release_notes: false

